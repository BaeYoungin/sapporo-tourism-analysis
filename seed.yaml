documents:
  - name: AI_Market_Report_2025.txt
    label: "📊 AI 시장 보고서 (2025)"
    text: |
      글로벌 AI 시장 동향 보고서 2025

      요약
      본 보고서는 2025년 글로벌 인공지능(AI) 시장의 현황과 전망을 분석합니다.

      1. 시장 규모 및 성장률
      2025년 글로벌 AI 시장 규모는 약 4,200억 달러로 추정되며, 전년 대비 38% 성장하였습니다.
      생성형 AI(Generative AI) 분야는 전체 시장의 29%를 차지하며 가장 빠른 성장세를 보이고 있습니다.
      아시아·태평양 지역은 CAGR 42%로 가장 높은 성장률을 기록하고 있으며, 특히 한국·일본·인도가 주요 성장 동력입니다.

      2. 핵심 기술 트렌드
      2.1 대형 언어 모델(LLM)
      GPT-4o, Claude 3.5, Gemini 1.5 등 최신 LLM은 멀티모달 기능을 기본 탑재하게 되었습니다.
      추론 능력 향상을 위한 Chain-of-Thought, Tree-of-Thought 기법이 산업 전반에 확산 중입니다.
      모델 경량화(SLM) 기술 발전으로 온디바이스 AI 구현이 가속화되고 있습니다.

      2.2 에이전틱 AI(Agentic AI)
      자율적으로 작업을 계획·실행하는 AI 에이전트 시장이 급성장 중입니다.
      멀티 에이전트 프레임워크(AutoGen, LangGraph 등)가 기업 환경에 도입되고 있습니다.

      2.3 RAG(Retrieval-Augmented Generation)
      기업 내부 데이터와 LLM을 결합하는 RAG 아키텍처가 표준으로 자리잡고 있습니다.
      벡터 데이터베이스 시장(Pinecone, Weaviate, Chroma)이 연 65% 성장 중입니다.

      3. 산업별 도입 현황
      금융: 리스크 분석, 사기 탐지, 자동화 보고서 생성 등에 AI 도입률 78%
      의료: 의료 영상 분석, 신약 개발, 임상 노트 자동화에 AI 활용
      제조: 예측 유지보수, 품질 검사 자동화로 비용 절감 효과 연평균 23%
      법률: 계약서 검토, 판례 분석 등 법률 AI 솔루션 시장 연 55% 성장

      4. 주요 리스크 및 도전 과제
      4.1 규제 및 컴플라이언스
      EU AI Act 시행(2025년 8월)으로 고위험 AI 시스템에 대한 엄격한 규제 적용
      데이터 프라이버시 규정(GDPR, 개인정보보호법) 준수 비용 증가

      4.2 기술적 한계
      환각(Hallucination) 문제: LLM의 사실 오류율 평균 8~15% 수준
      컨텍스트 길이 제한으로 인한 장문 문서 처리의 정확도 저하
      실시간 처리 요구 증가에 따른 인프라 비용 급등

      4.3 인재 부족
      AI 전문 인력 수요 대비 공급 부족률 43%
      기업의 AI 도입 속도 대비 내부 역량 부족

      5. 2026~2027년 전망 및 권고사항
      시장 규모: 2027년까지 8,500억 달러 돌파 예상
      온디바이스 AI: 스마트폰·IoT 기기의 AI 기능 내재화 가속
      AI 거버넌스: 기업 내 AI 윤리 위원회 설립이 표준화될 전망

      권고사항:
      1. 기업은 AI 전략 로드맵을 3년 단위로 수립하고, 데이터 인프라 우선 투자
      2. RAG 기반 사내 지식관리 시스템 도입으로 생산성 향상 추구
      3. AI 리터러시 교육 프로그램 전 직원 대상 의무화
      4. 규제 준수 전담팀(AI Compliance Team) 조기 구성
      5. 파일럿 프로젝트 → 단계적 확산 방식의 도입 전략 권장

      결론
      AI 기술은 더 이상 경쟁 우위가 아닌 생존의 필수 조건이 되고 있습니다.
      기업과 정부 모두 AI 혁신과 책임감 있는 거버넌스의 균형을 맞추는 전략이 요구됩니다.

  - name: Project_Proposal_EcoApp.txt
    label: "🌱 프로젝트 제안서 (친환경 앱)"
    text: |
      프로젝트 제안서: GreenTrack - 개인 탄소발자국 추적 앱

      제안일: 2025년 4월
      제안팀: Product Innovation Team

      1. 프로젝트 개요
      GreenTrack은 개인 사용자가 일상 속 탄소 배출량을 실시간으로 추적하고, AI 기반 개인화 제안을 통해 친환경 생활 습관을 형성하도록 돕는 모바일 앱입니다.

      2. 문제 정의
      현황:
      - 전 세계 탄소 배출량의 약 72%가 개인 소비와 연관
      - 국내 성인의 62%가 탄소발자국 개념을 인지하나, 실제 행동 변화율은 12%에 불과
      - 기존 탄소 계산기 앱은 복잡한 입력 방식으로 지속 사용률 7%에 불과

      문제점:
      - 탄소 배출 정보의 불투명성 및 접근성 부족
      - 즉각적인 피드백 부재로 동기 부여 약화
      - 개인화된 개선 가이드 부재

      3. 솔루션
      3.1 핵심 기능
      ① 자동 소비 추적: 신용카드·가계부 앱 연동으로 소비 패턴 자동 분석
      ② AI 탄소 계산: 구매 품목·이동 수단·식단 데이터를 LLM으로 실시간 탄소량 산출
      ③ 개인화 제안: 사용자 생활 패턴 기반 탄소 감축 행동 Top 3 매일 제안
      ④ 소셜 챌린지: 친구·가족과 탄소 감축 목표 공유 및 경쟁
      ⑤ 오프셋 마켓: 검증된 탄소 상쇄 프로젝트 직접 후원 기능

      3.2 기술 스택
      - Frontend: React Native (iOS/Android)
      - Backend: Python FastAPI + PostgreSQL
      - AI/ML: OpenAI GPT-4o API + 자체 탄소 환산 모델
      - 데이터 연동: 오픈 뱅킹 API, 교통카드 API

      4. 시장 분석
      목표 시장: 국내 MZ세대(20~39세) 환경 관심층 약 850만 명
      TAM: 글로벌 기후테크 앱 시장 $2.3B (2025)
      SAM: 국내 친환경 앱 시장 $120M
      SOM: 1년 내 목표 MAU 50만 명

      경쟁사 분석:
      - Klima (독일): 탄소 오프셋 중심, 개인화 부족
      - Oroeco (미국): 데이터 연동 복잡, 한국 미진출
      - 차별화: AI 기반 자동화 + 한국형 데이터 연동 + 소셜 요소

      5. 수익 모델
      - 프리미엄 구독: 월 3,900원 (고급 분석 리포트, 무제한 챌린지)
      - 탄소 오프셋 수수료: 후원 금액의 8%
      - B2B ESG 리포트: 기업 임직원 대상 단체 구독 패키지

      6. 개발 일정
      Phase 1 (1~3개월): MVP 개발 - 기본 추적·계산 기능
      Phase 2 (4~6개월): AI 개인화 추천 엔진 구축
      Phase 3 (7~9개월): 소셜 기능 + 오프셋 마켓 오픈
      Phase 4 (10~12개월): B2B 패키지 출시 + 글로벌 확장 준비

      7. 예산 및 자원 계획
      총 필요 예산: 2억 4천만 원
      - 개발비: 1억 5천만 원 (개발자 4인 × 9개월)
      - 마케팅: 5천만 원
      - 인프라/API 비용: 2천만 원
      - 기타 운영비: 2천만 원

      8. 기대 효과
      정량적 목표 (출시 12개월):
      - MAU 50만 명 달성
      - 사용자 1인당 평균 탄소 감축률 15%
      - 월간 반복 수익(MRR) 1억 원
      - 탄소 오프셋 누적 후원액 10억 원

      사회적 임팩트:
      - 연간 CO₂ 3만 톤 감축 기여 (사용자 행동 변화 기준)

  - name: Meeting_Minutes_Q2_Review.txt
    label: "📋 회의록 (Q2 사업 검토)"
    text: |
      2025년 Q2 사업 성과 검토 회의록

      일시: 2025년 7월 10일 (목) 14:00 ~ 16:30
      장소: 본사 12층 대회의실 / Zoom 하이브리드
      참석자: 김민준 (CEO), 박서연 (COO), 이준혁 (CTO), 최유나 (CMO), 정다은 (CFO), 각 팀장 8인

      1. 개회 및 안건 확인 (김민준 CEO)
      전분기 대비 전반적 성과 개선 추세를 확인하고, Q3 전략 방향을 논의하기 위해 회의 소집.

      2. Q2 재무 성과 (정다은 CFO)
      매출: 48억 원 (목표 45억 원 대비 +6.7% 초과 달성)
      영업이익: 7.2억 원 (영업이익률 15%)
      순이익: 5.8억 원 (전분기 대비 +22%)
      MRR(월간 반복 수익): 12억 원 (전분기 대비 +18%)
      고객 이탈률: 3.2% (업계 평균 5.1% 대비 양호)

      CFO 코멘트: "인프라 비용이 예상보다 23% 초과되어 Q3 클라우드 계약 재협상 필요. AWS Reserved Instance 전환으로 약 1.5억 원 절감 가능."

      3. 제품/기술 업데이트 (이준혁 CTO)
      완료된 작업:
      - AI 추천 엔진 v2.0 배포 (클릭률 34% 향상)
      - 모바일 앱 성능 개선 (로딩 속도 40% 단축)
      - 보안 취약점 패치 12건 완료

      진행 중:
      - 실시간 협업 기능 개발 (8월 출시 예정, 현재 진도 65%)
      - 데이터 파이프라인 리팩토링 (9월 완료 목표)

      기술 부채 이슈:
      - 레거시 결제 모듈이 신규 기능 개발의 병목. Q3 내 전면 교체 결정.
      - 예상 소요: 개발자 3인 × 2개월 + 외부 컨설팅 3천만 원

      CTO 요청사항: 시니어 백엔드 엔지니어 2명 추가 채용 승인 요청 → CEO 승인.

      4. 마케팅 및 영업 (최유나 CMO)
      Q2 마케팅 성과:
      - 신규 고객 획득: 2,840명 (목표 2,500명 대비 +13.6%)
      - CAC(고객 획득 비용): 평균 18만 원 (Q1 대비 -12%)
      - 채널별 전환율: 콘텐츠 마케팅 4.8%, 유료 광고 2.1%, 추천 8.9%

      Q3 마케팅 전략:
      ① 추천 프로그램 강화: 추천인·피추천인 모두 1개월 무료 제공
      ② 파트너십 확대: B2B 리셀러 채널 3개사 추가 계약 예정
      ③ 컨텐츠 마케팅: 기술 블로그 주 2회 발행, LinkedIn 팔로워 1만 명 목표

      5. 운영 이슈 (박서연 COO)
      고객 지원:
      - 평균 응답 시간: 2.3시간 (목표 2시간 대비 소폭 초과)
      - CSAT(고객 만족도): 4.4/5.0
      - 반복 문의 Top 3: ① 결제 오류(31%) ② 데이터 내보내기(24%) ③ 계정 연동(18%)

      개선 조치:
      - AI 챗봇 도입으로 1차 응대 자동화 (예상 응답 시간 1.5시간 단축)
      - 결제 모듈 교체 시 오류 31% 해결 예상

      6. 리스크 관리
      식별된 주요 리스크:
      1. 경쟁사 A사 신규 기능 출시 예고 → 차별화 로드맵 가속화 필요
      2. 개인정보보호법 개정안 9월 시행 → 법무팀 컴플라이언스 검토 착수
      3. 핵심 인력 이탈 위험 (엔지니어 2명 타사 오퍼 수령 확인) → HR에서 리텐션 패키지 검토 중

      7. Q3 목표 합의
      매출 목표: 58억 원 (Q2 대비 +21%)
      신규 고객: 3,200명
      MRR 목표: 15억 원
      제품 출시: 실시간 협업 기능 (8월), 모바일 오프라인 모드 (9월)

      8. 액션 아이템
      - CFO 정다은: AWS 계약 재협상 완료 (기한: 7/25)
      - CTO 이준혁: 시니어 엔지니어 채용 공고 게시 (기한: 7/15)
      - CMO 최유나: 추천 프로그램 기획서 제출 (기한: 7/20)
      - COO 박서연: AI 챗봇 도입 제안서 제출 (기한: 7/22)
      - 법무팀장: 개인정보보호법 대응 체크리스트 작성 (기한: 7/31)
      - HR팀장: 핵심 인력 리텐션 패키지 제안 (기한: 7/18)

      9. 폐회
      다음 회의: 2025년 7월 24일 (목) 14:00 (액션 아이템 중간 점검)
      회의록 작성: 경영기획팀 / 배포: 7월 11일
